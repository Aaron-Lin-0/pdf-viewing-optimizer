name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-comparison.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/run_compatibility.py fixtures
      - run: python tools/build_release.py
