name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-comparison.txt
      - run: npm ci
      - run: python -m ruff check .
      - name: Build pinned optional BOOX renderer
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python tools/build_boox_renderer.py --work audit-output/ci-renderer-source --output vendor/boox-notes-renderer.exe
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/run_compatibility.py fixtures --output audit-output/ci-fixtures
      - run: python tools/build_release.py
