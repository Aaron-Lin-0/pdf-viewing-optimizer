# Lint for definite errors and likely bugs only; style is left as written.
target-version = "py310"
line-length = 200
extend-exclude = ["node_modules", "dist", "audit-output"]

[lint]
select = ["E9", "F", "B"]
# B023: the flagged closures are invoked synchronously inside their loop iteration.
# B905: zip() inputs are built from the same sequence; strict= adds noise, not safety.
ignore = ["B023", "B905"]
